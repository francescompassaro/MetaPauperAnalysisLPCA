{% extends "base.html" %}
{% block content %}

<div class="max-w-md mx-auto bg-gray-800 p-8 rounded-lg border border-gray-700 space-y-6 mt-12">
    <div class="text-center space-y-1">
        <h1 class="text-xl font-bold text-white">Amministrazione</h1>
        <p class="text-xs text-gray-400">Inserisci la chiave d'accesso amministrativa</p>
    </div>

    {% if errore %}
    <div class="bg-red-950 border border-red-800 text-red-300 px-4 py-2.5 rounded text-xs text-center">
        Password non corretta. Riprova.
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4 text-sm">
        <div>
            <label class="block text-xs text-gray-400 mb-1">Chiave d'accesso</label>
            <input type="password" name="password" required class="w-full p-2 bg-gray-900 border border-gray-700 rounded text-gray-200 focus:outline-none focus:border-blue-500">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded font-bold transition">Accedi</button>
    </form>
</div>

{% endblock %}
