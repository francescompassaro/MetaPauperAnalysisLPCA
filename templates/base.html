<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lega Pauper Capua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col">

    <!-- NAV BAR -->
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-6">
            <span class="text-xl font-bold tracking-wider text-blue-400">Lega Pauper Capua</span>
            <a href="/" class="hover:text-blue-400 transition text-sm font-medium">Dashboard</a>
            <a href="/liste" class="hover:text-blue-400 transition text-sm font-medium">Liste per Tappa</a>
            {% if is_admin %}
            <a href="/admin" class="text-yellow-400 hover:text-yellow-300 transition text-sm font-semibold">Amministrazione</a>
            {% endif %}
        </div>
        <div>
            {% if is_admin %}
            <a href="/logout" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded text-xs font-bold transition">Esci</a>
            {% else %}
            <a href="/login" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-xs font-bold transition">Accedi</a>
            {% endif %}
        </div>
    </nav>

    <!-- CONTENT -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-6xl">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-800 border-t border-gray-700 text-center py-4 text-xs text-gray-500">
        Lega Pauper Capua © 2026 - Road to Lucca
    </footer>

</body>
</html>
